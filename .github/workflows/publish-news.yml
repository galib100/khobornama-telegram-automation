name: Khobornama Telegram Auto Publisher

on:
  schedule:
    # Runs at the start of every hour UTC (Bangladesh time: UTC+6)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run (logs only, does not send to Telegram or save state)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: khobornama-telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish new articles
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          NEWS_ENDPOINT: ${{ secrets.NEWS_ENDPOINT || vars.NEWS_ENDPOINT }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || vars.SITE_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_NEWS_PER_RUN: "1"
          STATE_FILE: "data/posted_ids.json"
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true')) && 'true' || 'false' }}
        run: python main.py

      - name: Commit updated publication state
        if: success()
        run: |
          if git diff --quiet -- data/posted_ids.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_ids.json
          git commit -m "chore: update Telegram publication state"
          git pull --rebase origin main || true
          git push
