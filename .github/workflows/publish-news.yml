name: Khobornama Telegram Auto Publisher

on:
  schedule:
    # GitHub scheduled workflows use UTC. 04:00 UTC = 10:00 Bangladesh time.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test without posting or saving article IDs"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: khobornama-telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish new articles
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEWS_ENDPOINT: ${{ vars.NEWS_ENDPOINT }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_NEWS_PER_RUN: "30"
          STATE_FILE: "data/posted_ids.json"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python main.py

      - name: Commit updated publication state
        if: success()
        run: |
          if git diff --quiet -- data/posted_ids.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_ids.json
          git commit -m "chore: update Telegram publication state"
          git push
